name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: sudo apt-get install -y nasm
      # The web build against its budgets (apps/web/README.md "Budgets"), on its own ahead of
      # `check`: a build over them fails CI here whatever the steps after it do.
      - run: bun run bundle
      - run: bun run check
      - run: bun run build
      - run: bun run golden
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 5
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
