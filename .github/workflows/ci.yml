name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: sudo apt-get install -y nasm
      # The web build against its budgets (apps/web/README.md "Budgets"), on its own ahead of
      # `check`: a build over them fails CI here whatever the steps after it do.
      - run: bun run bundle
      - run: bun run check
      - run: bun run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 5
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

  # The Playwright suite (apps/web/e2e) against the production build and the seeded e2e Worker
  # (`wrangler dev`, Miniflare, `DEV_FAKE_AUTH=1`; apps/web/playwright.config.ts starts both), in
  # the Playwright image, whose Linux screenshots the `-linux` baselines are. Four shards; the
  # config retries a failure once under CI and keeps its trace, uploaded here.
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g bun@1.3.6
      - run: bun install --frozen-lockfile
      - name: Playwright, shard ${{ matrix.shard }} of 4
        working-directory: apps/web
        run: bunx playwright test --project=chromium --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7

  # PRODUCT_SPEC §11: `bun run golden` reproduces identical results in Bun, Chrome, and Miniflare.
  # Each leg plays every golden round from the roster's sources and checks it against the one
  # committed file, packages/bots/goldens/results.json, hash for hash: all three green is one hash
  # set. Bun: the main thread and a Worker (scripts/golden.ts). Chromium: a module Worker on a
  # harness page (apps/web/e2e/goldens.spec.ts). Miniflare: workerd (apps/api/test/goldens.test.ts).
  determinism:
    name: determinism (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: bun
            dir: .
            run: bun run golden
          - runtime: chromium
            dir: apps/web
            run: bunx playwright test --project=chromium e2e/goldens.spec.ts
          - runtime: miniflare
            dir: apps/api
            run: bunx vitest run test/goldens.test.ts
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g bun@1.3.6
      - run: bun install --frozen-lockfile
      - name: The goldens in ${{ matrix.runtime }}
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.run }}

  # Lighthouse CI (lighthouserc.json) on /, /arena, /editor, /docs, and /hills/main: the build
  # under `vite preview`, its /api on the seeded e2e Worker, three runs a page, desktop preset.
  # Performance, accessibility, best practices, and SEO must each be 0.95 or more (median run).
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7
