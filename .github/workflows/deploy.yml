name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_commit }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
        env:
          SKIP_WASM_BUILD: '1'

      - run: sudo apt-get install -y nasm

      - run: bun run build

      - name: Apply D1 migrations
        run: |
          cd apps/api
          npx wrangler d1 migrations apply asmbots --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Get app version
        id: version
        run: echo "VERSION=$(bun run version)" >> $GITHUB_OUTPUT

      - name: Deploy to production
        run: |
          cd apps/api
          npx wrangler deploy --var APP_VERSION:${{ steps.version.outputs.VERSION }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run smoke tests
        run: bun run scripts/smoke.ts https://asmbots.io

      - name: Rollback on failure
        if: failure()
        run: |
          cd apps/api
          npx wrangler rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
