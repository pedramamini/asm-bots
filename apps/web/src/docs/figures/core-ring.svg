<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 262" width="500" height="262" font-family="var(--font-mono)" font-size="12">
  <title>The core as a ring: addresses 0x0000 to 0xFFFF clockwise, 0xFFFF next to 0x0000; three bots, and bombs one of them wrote</title>
  <circle cx="130" cy="140" r="86" fill="none" stroke="var(--panel-2)" stroke-width="16" />
  <circle cx="130" cy="140" r="94" fill="none" stroke="var(--border)" />
  <circle cx="130" cy="140" r="78" fill="none" stroke="var(--border)" />
  <g stroke="var(--border-strong)">
    <line x1="130" y1="63" x2="130" y2="45" />
    <line x1="207" y1="140" x2="225" y2="140" />
    <line x1="130" y1="217" x2="130" y2="235" />
    <line x1="53" y1="140" x2="35" y2="140" />
  </g>
  <g fill="none" stroke-width="16">
    <path d="M177.8 68.5A86 86 0 0 1 196.5 85.4" stroke="var(--bot-0)" />
    <path d="M155.0 222.3A86 86 0 0 1 130.0 226.0" stroke="var(--bot-1)" />
    <path d="M45.7 156.8A86 86 0 0 1 44.4 131.6" stroke="var(--bot-2)" />
  </g>
  <g fill="var(--bot-0)">
    <rect x="200.8" y="92.8" width="6" height="6" />
    <rect x="206.5" y="104.1" width="6" height="6" />
    <rect x="210.4" y="116.1" width="6" height="6" />
  </g>
  <path d="M96.3 29.0A116 116 0 0 1 163.7 29.0" fill="none" stroke="var(--accent)" />
  <path d="M163.7 29.0l-8 -5.5M163.7 29.0l-9.5 1.5" fill="none" stroke="var(--accent)" />
  <text x="130" y="16" text-anchor="middle" fill="var(--accent-fg)" font-size="11">0xFFFF + 1 = 0x0000</text>
  <g fill="var(--text-muted)" text-anchor="middle" font-size="11">
    <text x="130" y="80">0x0000</text>
    <text x="180" y="144">0x4000</text>
    <text x="130" y="206">0x8000</text>
    <text x="80" y="144">0xC000</text>
  </g>
  <g font-size="11">
    <rect x="268" y="60" width="14" height="14" fill="var(--bot-0)" />
    <rect x="268" y="80" width="14" height="14" fill="var(--bot-1)" />
    <rect x="268" y="100" width="14" height="14" fill="var(--bot-2)" />
    <text x="290" y="71" fill="var(--text)">a bot: 512 bytes at most</text>
    <text x="290" y="91" fill="var(--text)">each in its own hue</text>
    <text x="290" y="111" fill="var(--text-muted)">(not to scale)</text>
    <rect x="272" y="134" width="6" height="6" fill="var(--bot-0)" />
    <text x="290" y="141" fill="var(--text)">a word it wrote: its hue too</text>
    <rect x="268" y="160" width="14" height="14" fill="var(--panel-2)" stroke="var(--border)" />
    <text x="290" y="171" fill="var(--text)">empty core: zeros,</text>
    <text x="290" y="187" fill="var(--text)">and 00 is dat</text>
    <text x="268" y="221" fill="var(--text-muted)">65,536 bytes, one ring,</text>
    <text x="268" y="237" fill="var(--text-muted)">shared by every bot</text>
  </g>
</svg>
