# `bun test` run from this package reads this file, not the root one. The component tests' DOM:
# ../../packages/ui/test/dom/preload.ts says why it loads first. The Playwright specs
# (e2e/*.spec.ts) show as skipped: ../../scripts/skip-playwright-specs.ts.
[test]
coverage = false
preload = ["../../packages/ui/test/dom/preload.ts", "../../scripts/skip-playwright-specs.ts"]
